name: oksigenia_sms
description: >-
  Permission-minimal Android SMS sender. Sends a single, concatenated multipart
  SMS without READ_PHONE_STATE — works on Android 12–17 and GrapheneOS, where
  SmsManager.divideMessage now demands that permission.
version: 0.1.0
publish_to: none
repository: https://github.com/OksigeniaSL/oksigenia-sos/tree/main/packages/oksigenia_sms
homepage: https://github.com/OksigeniaSL/oksigenia-sos/tree/main/packages/oksigenia_sms
issue_tracker: https://github.com/OksigeniaSL/oksigenia-sos/issues
topics:
  - sms
  - android
  - telephony
  - messaging
  - emergency

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.oksigenia.oksigenia_sms
        pluginClass: OksigeniaSmsPlugin
