name: oksigenia_sos
description: "Outdoor Emergency Assistant"
publish_to: 'none'
version: 4.3.1+43100

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.38.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Core Logic & Background
  flutter_background_service: ^5.0.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1
  wakelock_plus: ^1.2.8
  another_telephony: ^0.4.1  # 🟢 BACKGROUND SMS — fork activo de telephony (discontinuado). Si falla, evaluar sms_sender.
  oksigenia_sms:             # 🟢 envío propio: SMS concatenado sin READ_PHONE_STATE (Android 17/GrapheneOS). Repo propio, commit pineado para RB.
    git:
      url: https://github.com/OksigeniaSL/oksigenia_sms.git
      ref: c1091ee58ade9abe05afc936b6de88167bb7620e
  
  # Sensors & Audio
  sensors_plus: ^7.0.0       
  audioplayers: ^6.0.0       
  vibration: ^3.1.5          

  # State & UI
  shared_preferences: ^2.5.4 
  cupertino_icons: ^1.0.8
  battery_plus: ^7.0.0
  http: ^1.6.0
  package_info_plus: ^9.0.0
  provider: ^6.1.5+1
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  slide_to_act: ^2.0.2 # 🟢 BOTÓN DESLIZANTE MODERNO Y COMPATIBLE
  path_provider: ^2.1.5 # File logger del Smart Sentinel (debug builds)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Sustituye geolocator_android por el fork FLOSS (sin Google Play Services).
# El upstream declara play-services-location como dependencia dura; este fork
# borra ese camino y usa solo el LocationManager nativo de Android. Así el APK
# es realmente GMS-free en TODAS las fuentes (Izzy/F-Droid/GitHub) con una sola
# firma. pubspec.lock fija el commit exacto → build reproducible.
dependency_overrides:
  geolocator_android:
    git:
      url: https://github.com/Zverik/flutter-geolocator.git
      ref: floss
      path: geolocator_android

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/ic_background.png"
  adaptive_icon_foreground: "assets/icon/ic_foreground.png"
  notification_icon: "ic_stat_oksigenia"
  image_path_android: "assets/images/logo_white.png"